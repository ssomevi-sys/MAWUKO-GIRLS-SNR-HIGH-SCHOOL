<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mawuko Girls SHS – School Management System</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f2f6ff;--card:#fff;--tx:#0a1a3a;--mut:#5b6b8c;--pri:#0047ff;--pri2:#e6edff;--acc:#0047ff;--bd:#d3deff;--bad:#d92d20;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--pri);color:#fff;padding:14px 20px;border-bottom:4px solid #fff}header h1{margin:0;font:700 20px Georgia,serif;letter-spacing:.5px}header small{opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);padding:0 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;color:var(--mut);padding:12px 14px;font:600 14px inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--acc)}
main{max-width:1100px;margin:auto;padding:18px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:16px;margin-bottom:14px}
.stat b{display:block;font:700 28px Georgia,serif;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
h2{font:700 18px Georgia,serif;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,button.b{padding:8px 10px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--tx);font:inherit}
button.b{background:var(--pri);color:#fff;border-color:var(--pri);cursor:pointer;font-weight:600}button.b.s{background:none;color:var(--bad);border-color:var(--bd);padding:3px 8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.bar{height:10px;background:var(--pri2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tag{background:var(--pri2);color:var(--pri);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
footer{text-align:center;color:var(--mut);font-size:12px;padding:16px}
.mut{color:var(--mut)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
body:not(.in) header,body:not(.in) nav,body:not(.in) main,body:not(.in) footer{display:none}body.in #login{display:none}

.glass{position:relative;z-index:1;width:100%;max-width:400px;padding:34px 30px;color:#fff;border-radius:18px;background:rgba(0,28,120,.66);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.45);box-shadow:0 20px 50px rgba(0,20,100,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.glass h1{font:700 19px Georgia,serif;margin:0 0 4px;text-align:center;letter-spacing:.5px}.glass p{margin:0 0 20px;text-align:center;font-size:13px;opacity:.9}
.glass label{display:block;font-size:12px;margin:12px 0 4px;opacity:.9}.glass input{width:100%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;padding:11px 12px;border-radius:8px}
.glass input::placeholder{color:#e1ebff}.glass button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#fff;color:#0047ff;font:700 15px inherit;cursor:pointer}
.glass .er{color:#ffd1cc;font-size:13px;min-height:18px;margin-top:10px;text-align:center}.glass small{display:block;text-align:center;margin-top:18px;opacity:.8;font-size:11px}
.pp{width:36px;height:46px;border:1px solid var(--bd);display:grid;place-items:center;background:var(--pri2);color:var(--pri);font-weight:700;overflow:hidden;border-radius:2px}.pp img{width:100%;height:100%;object-fit:cover}.pp.c{cursor:pointer}
.pp.c{cursor:zoom-in}.b2{padding:8px 10px;background:var(--pri);color:#fff;border-radius:3px;font-weight:600;cursor:pointer}#vw{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:16px;background:rgba(0,16,70,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header .lg,.glass .lg{object-fit:contain;background:#fff;border-radius:8px;padding:3px}header .lg{height:46px;width:46px;margin-right:12px;flex:none}.glass .lg{display:block;height:84px;width:84px;margin:0 auto 10px}.hb{display:flex;align-items:center}.sl{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.sl img{height:110px;width:110px;object-fit:contain;border:2px solid var(--pri);border-radius:8px;padding:4px;background:#fff}.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 16px}.sg label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.sg input{width:100%}
.sr{cursor:pointer}.sr:hover td{background:rgba(0,40,140,.07)}.pf{background:var(--card);border-radius:8px;padding:18px;width:720px;max-width:96vw;max-height:92vh;overflow:auto;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease}.pf h3{margin:0;font-family:Georgia,serif;color:var(--pri)}.pf h4{margin:16px 0 6px;font-family:Georgia,serif;color:var(--pri);border-bottom:1px solid #8883;padding-bottom:3px}.pf .hd{display:flex;gap:14px;align-items:center}.pf .hd img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:3px solid var(--pri);cursor:zoom-in}.pf .nop{width:96px;height:96px;border-radius:6px;border:2px dashed #8886;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;text-align:center}.pf .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px}.pf .kv div span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.pf .kv div b{font-weight:600}
.vc{background:var(--card);border-radius:8px;padding:16px;text-align:center;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease}.vc img{max-width:80vw;max-height:62vh;border-radius:4px;border:3px solid var(--pri)}.vc h3{margin:10px 0 2px;font-family:Georgia,serif}.vc p{margin:0 0 12px;color:var(--mut);font-size:13px}

try{const salt=rs(),rec={name:n,u,role:'ict',on:true,salt,h:hpw(u,p,salt)},base=smp?init():{students:[],staff:[],att:{},grades:{},notices:[]};
S=Object.assign(empty(),base,{users:[{...rec,uid:u}]});ME={name:n,u,role:'ict',on:true,uid:u};last={};
if(!await push())throw new Error('The data could not be written. Check that the Firestore rules were published.');
await db.doc('meta/setup').set({done:true,by:u,at:new Date().toISOString()});try{sessionStorage.setItem('mg_s',JSON.stringify({u,h:rec.h}))}catch(e){}
await Promise.all([lp('__logo__'),lp('__logopdf__')]);tab=ROLES.ict.home;render()}catch(x){ME=null;S=empty();er(am(x))}}
async function enter(u,d){entering=true;try{if(!d.on||!ROLES[d.role]){showLogin('This account is suspended or invalid. Contact the Head of ICT.');return}
busy('Loading your data…');ME={name:d.name,u,role:d.role,house:d.house,subject:d.subject,on:true,uid:u};try{sessionStorage.setItem('mg_s',JSON.stringify({u,h:d.h}))}catch(e){}
await pull();await Promise.all([lp('__logo__'),lp('__logopdf__')]);tab=ROLES[ME.role].home;render();if(u=='ict'&&d.h===hpw('ict','admin123',d.salt||''))setTimeout(()=>alert('You are using the default password. Please change it now: Users › Change password.'),400)}catch(e){ME=null;showLogin('Could not load data: '+am(e))}finally{entering=false}}
async function doLogin(){const u=$('lu').value.trim().toLowerCase(),p=$('lp').value,er=m=>{$('le').textContent=m};if(!u||!p){er('Enter your username and password.');return}if(!UID.test(u)){er('Invalid username or password.');return}
try{const d=await db.doc('users/'+u).get();let dd=d.exists?d.data():null;if(!dd&&u=='ict'&&p=='admin123'){const salt=rs();dd={name:'Head of ICT',u:'ict',role:'ict',on:true,salt,h:hpw('ict','admin123',salt)};await db.doc('users/ict').set(dd);try{await db.doc('meta/setup').set({done:true,by:'ict',at:new Date().toISOString()})}catch(e){}}if(!dd||hpw(u,p,dd.salt||'')!==dd.h){er('Invalid username or password.');return}if(!entering)await enter(u,dd)}catch(x){er(am(x))}}
async function out(){if(dirty)await push();try{sessionStorage.removeItem('mg_s')}catch(e){}ME=null;S=empty();showLogin()}
async function boot(){if(!FIREBASE_CONFIG.apiKey||/^PASTE/.test(FIREBASE_CONFIG.apiKey)){showNoConfig();return}
try{fbInit(FIREBASE_CONFIG)}catch(e){showNoConfig(e.message);return}busy('Connecting to Firestore…');
try{const[su,br]=await Promise.all([db.doc('meta/setup').get(),db.doc('meta/branding').get()]);if(br.exists)S.cfg.school=br.data();await lp('__logo__');if(!su.exists){await autoSetup();return}}
catch(e){showNoConfig('Could not reach Firestore: '+am(e));return}
let ss=null;try{ss=JSON.parse(sessionStorage.getItem('mg_s'))}catch(e){}
if(ss&&UID.test(ss.u||'')){try{const d=await db.doc('users/'+ss.u).get();if(d.exists&&d.data().h===ss.h){await enter(ss.u,d.data());return}}catch(e){}}try{const iu=await db.doc('users/ict').get();DEFPW=iu.exists&&iu.data().h===hpw('ict','admin123',iu.data().salt||'')}catch(e){}showLogin()}

async function addU(){const n=$('un').value.trim(),u=$('uu').value.trim().toLowerCase(),p=$('up').value;if(!n||!UID.test(u)||p.length<6){alert('Enter a name, a username (3+ letters/numbers, no spaces) and a temporary password of at least 6 characters.');return}
try{if(S.users.some(x=>x.u==u)||(await db.doc('users/'+u).get()).exists){alert('That username is taken.');return}
const salt=rs(),rec={name:n,u,role:$('ur').value,house:$('uh').value,subject:$('us').value,on:true,salt,h:hpw(u,p,salt)};await db.doc('users/'+u).set(rec);S.users.push({...rec,uid:u});last['users/'+u]=cj(rec);alert('Account created. Give '+n+' the username and temporary password securely.');render()}catch(e){alert(am(e))}}
function rp(i){const x=S.users[i],p=prompt('New password for '+x.u+' (min 6 characters):');if(!p)return;if(p.length<6){alert('Password too short.');return}x.salt=rs();x.h=hpw(x.u,p,x.salt);save();if(x.uid==ME.uid)try{sessionStorage.setItem('mg_s',JSON.stringify({u:x.u,h:x.h}))}catch(e){}alert('Password updated.')}
function du(i){if(confirm('Delete the account '+S.users[i].u+'?')){S.users.splice(i,1);save();render()}}
async function autoSetup(){busy('Creating the database (first run)…');
try{const salt=rs(),rec={name:'Head of ICT',u:'ict',role:'ict',on:true,salt,h:hpw('ict','admin123',salt)};
S=Object.assign(empty(),{students:[],staff:[],att:{},grades:{},notices:[]},{users:[{...rec,uid:'ict'}]});ME={name:'Head of ICT',u:'ict',role:'ict',on:true,uid:'ict'};last={};
if(!await push())throw new Error('Could not write to Firestore. Publish the rules (Firestore › Rules) and reload.');
await db.doc('meta/setup').set({done:true,by:'ict',at:new Date().toISOString()});ME=null;S=empty();DEFPW=true;showLogin()}
catch(e){ME=null;S=empty();showNoConfig('Could not create the database: '+am(e))}}
function loadSample(){if(S.students.length){alert('The database already has students, so sample data was not loaded.');return}const b=init();S.students=b.students;S.staff=b.staff;save();alert('Sample data loaded.')}
const GATEWAY=`// Mawuko SMS email gateway (Node 18+).  Setup:  npm i express cors nodemailer
// Env: SMTP_HOST SMTP_PORT SMTP_SECURE(true|false) SMTP_USER SMTP_PASS MAIL_FROM API_KEY PORT
// Run:  node email-gateway.js   then put https://YOUR-HOST/send-report in Reports > Email gateway URL.
const express=require('express'),cors=require('cors'),nodemailer=require('nodemailer');
const app=express();app.use(cors());app.use(express.json({limit:'10mb'}));
const t=nodemailer.createTransport({host:process.env.SMTP_HOST,port:+process.env.SMTP_PORT||587,secure:process.env.SMTP_SECURE==='true',auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}});
app.post('/send-report',async(req,res)=>{
  if(process.env.API_KEY&&req.get('x-api-key')!==process.env.API_KEY)return res.status(401).json({error:'unauthorised'});
  const{to,subject,message,filename,pdfBase64}=req.body||{};
  const pdf=Buffer.from(pdfBase64||'','base64');
  if(!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(to||'')||pdf.slice(0,5).toString()!=='%PDF-')return res.status(400).json({error:'a valid recipient and a PDF are required'});
  const name=String(filename||'report').replace(/[^\\w.-]/g,'_').replace(/(\\.pdf)?$/i,'.pdf');
  try{await t.sendMail({from:process.env.MAIL_FROM,to,subject,text:message,attachments:[{filename:name,content:pdf,contentType:'application/pdf'}]});res.json({ok:true})}
  catch(e){res.status(500).json({error:e.message})}
});
app.listen(process.env.PORT||3000,()=>console.log('Email gateway running'));
`;
function cp(id){const e=$(id);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand('copy')}alert('Copied.')}
function dlt(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()}
V['Backend Setup']=()=>{let pid=FIREBASE_CONFIG.projectId||'—';

return`<div class="card"><h2>Backend setup</h2><p>Connected Firebase project: <b>${esc(pid)}</b></p><ol class="mut"><li>Create a Firebase project and a Firestore database (Firestore Database › Create database).</li><li>Paste your Firebase config into <b>FIREBASE_CONFIG</b> at the top of this file\'s script.</li><li>Publish the rules below (Firestore › Rules). They are open: see the warning.</li><li>Optional: run the email gateway below to email report PDFs to parents automatically.</li></ol></div>

boot();
